<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create an account on Recommendation-Ranked Social Feed Studio.">
  <title>Create Account | Recommendation Studio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">

  <main class="auth-card" style="max-width: 520px;">
    <header class="auth-header">
      <div class="auth-logo-badge">✨</div>
      <h2>Join the Studio</h2>
      <p>Create your profile and start tuning recommendation ranking</p>
    </header>

    <form id="register-form">
      <div id="reg-error-alert" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-md); background: #fee2e2; border: 1px solid #f87171; color: #991b1b; font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label for="reg-name" class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-input" placeholder="Ada Lovelace" required>
        </div>

        <div class="form-group">
          <label for="reg-username" class="form-label">Username</label>
          <input type="text" id="reg-username" class="form-input" placeholder="adalovelace" required autocomplete="username">
          <span id="reg-username-feedback" class="form-feedback"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-email" class="form-label">Email Address</label>
        <input type="email" id="reg-email" class="form-input" placeholder="ada@algorithms.org" required autocomplete="email">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label for="reg-password" class="form-label">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="reg-password" class="form-input" placeholder="Min 6 characters" required autocomplete="new-password">
            <button type="button" class="btn-toggle-password" id="btn-toggle-reg-pass" aria-label="Toggle password visibility" title="Show/hide password">👁️</button>
          </div>
          <div class="password-strength-container" id="reg-strength-box" style="display: none;">
            <div class="strength-track">
              <div class="strength-fill" id="strength-fill-bar"></div>
            </div>
            <span class="strength-label" id="strength-text-lbl">Password Strength</span>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-confirm-password" class="form-label">Confirm Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="reg-confirm-password" class="form-input" placeholder="Repeat password" required autocomplete="new-password">
            <button type="button" class="btn-toggle-password" id="btn-toggle-reg-confirm" aria-label="Toggle password visibility" title="Show/hide password">👁️</button>
          </div>
          <span id="reg-match-feedback" class="form-feedback"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-avatar" class="form-label">Profile Avatar URL (Optional)</label>
        <input type="url" id="reg-avatar" class="form-input" placeholder="https://images.unsplash.com/...">
      </div>

      <div class="form-group">
        <label for="reg-bio" class="form-label">Short Bio (Optional)</label>
        <textarea id="reg-bio" class="form-textarea" rows="2" placeholder="Passionate about algorithmic fairness and network graphs."></textarea>
      </div>

      <button type="submit" class="btn btn-primary" id="btn-submit-register" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">
        Create Account
      </button>
    </form>

    <footer class="auth-footer">
      Already have an account? <a href="login.html">Sign in</a>
    </footer>
  </main>

  <script type="module">
    import { registerUser, redirectIfAuthenticated, initAuth, isUsernameTaken } from "./js/auth.js";
    import { showToast } from "./js/utils.js";

    // Redirect to dashboard if user is already authenticated
    await initAuth();
    if (redirectIfAuthenticated("dashboard.html")) {
      // redirected
    }

    const form = document.getElementById("register-form");
    const submitBtn = document.getElementById("btn-submit-register");
    const errorAlert = document.getElementById("reg-error-alert");

    const passInput = document.getElementById("reg-password");
    const confirmInput = document.getElementById("reg-confirm-password");
    const usernameInput = document.getElementById("reg-username");
    const usernameFeedback = document.getElementById("reg-username-feedback");
    const matchFeedback = document.getElementById("reg-match-feedback");

    const strengthBox = document.getElementById("reg-strength-box");
    const strengthBar = document.getElementById("strength-fill-bar");
    const strengthLbl = document.getElementById("strength-text-lbl");

    // Toggle password visibility
    const togglePassBtn = document.getElementById("btn-toggle-reg-pass");
    if (togglePassBtn) {
      togglePassBtn.addEventListener("click", () => {
        const isPass = passInput.type === "password";
        passInput.type = isPass ? "text" : "password";
        togglePassBtn.textContent = isPass ? "🙈" : "👁️";
      });
    }

    const toggleConfirmBtn = document.getElementById("btn-toggle-reg-confirm");
    if (toggleConfirmBtn) {
      toggleConfirmBtn.addEventListener("click", () => {
        const isPass = confirmInput.type === "password";
        confirmInput.type = isPass ? "text" : "password";
        toggleConfirmBtn.textContent = isPass ? "🙈" : "👁️";
      });
    }

    // Password strength evaluator
    passInput.addEventListener("input", () => {
      const val = passInput.value;
      if (!val) {
        strengthBox.style.display = "none";
        return;
      }
      strengthBox.style.display = "block";

      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      if (score <= 2) {
        strengthBar.className = "strength-fill weak";
        strengthLbl.textContent = "Password Strength: Weak (add numbers & symbols)";
        strengthLbl.style.color = "#ef4444";
      } else if (score <= 3) {
        strengthBar.className = "strength-fill medium";
        strengthLbl.textContent = "Password Strength: Medium";
        strengthLbl.style.color = "#f59e0b";
      } else {
        strengthBar.className = "strength-fill strong";
        strengthLbl.textContent = "Password Strength: Strong ✨";
        strengthLbl.style.color = "#10b981";
      }
      checkPasswordMatch();
    });

    // Check password matching
    function checkPasswordMatch() {
      if (!confirmInput.value) {
        matchFeedback.textContent = "";
        return;
      }
      if (passInput.value === confirmInput.value) {
        matchFeedback.className = "form-feedback valid";
        matchFeedback.textContent = "✓ Passwords match";
      } else {
        matchFeedback.className = "form-feedback invalid";
        matchFeedback.textContent = "✗ Passwords do not match";
      }
    }
    confirmInput.addEventListener("input", checkPasswordMatch);

    // Live username uniqueness indicator with debounce
    let usernameTimeout = null;
    usernameInput.addEventListener("input", () => {
      clearTimeout(usernameTimeout);
      const clean = usernameInput.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "");
      if (clean.length < 3) {
        usernameFeedback.className = "form-feedback invalid";
        usernameFeedback.textContent = "Min 3 characters (letters, numbers, _)";
        return;
      }
      usernameFeedback.className = "form-feedback";
      usernameFeedback.textContent = "Checking availability...";

      usernameTimeout = setTimeout(async () => {
        try {
          const taken = await isUsernameTaken(clean);
          if (taken) {
            usernameFeedback.className = "form-feedback invalid";
            usernameFeedback.textContent = `✗ @${clean} is already taken`;
          } else {
            usernameFeedback.className = "form-feedback valid";
            usernameFeedback.textContent = `✓ @${clean} is available`;
          }
        } catch (e) {
          usernameFeedback.textContent = "";
        }
      }, 400);
    });

    // Handle Registration Submit
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (errorAlert) errorAlert.style.display = "none";

      const name = document.getElementById("reg-name").value.trim();
      const username = usernameInput.value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const password = passInput.value;
      const confirmPassword = confirmInput.value;
      const profileImage = document.getElementById("reg-avatar").value.trim();
      const bio = document.getElementById("reg-bio").value.trim();

      if (password !== confirmPassword) {
        if (errorAlert) {
          errorAlert.textContent = "Passwords do not match. Please verify your entries.";
          errorAlert.style.display = "block";
        }
        showToast("Passwords do not match.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-sm"></span> Creating account...`;

      try {
        await registerUser({
          fullName: name,
          name,
          username,
          email,
          password,
          confirmPassword,
          profileImage,
          bio
        });
        
        showToast("Welcome! Redirecting to Dashboard...", "success");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 800);
      } catch (err) {
        if (errorAlert) {
          errorAlert.textContent = err.message;
          errorAlert.style.display = "block";
        }
        showToast(err.message, "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
